name: ring-flood-freeze
components:
- id: main
  capabilities:
  - id: waterSensor
    version: 1
  - id: temperatureAlarm
    version: 1
  - id: tamperAlert
    version: 1
  - id: battery
    version: 1
  - id: refresh
    version: 1
  - id: platemusic11009.deviceNetworkId
    version: 1
  - id: firmwareUpdate
    version: 1
  categories:
  - name: LeakSensor
preferences:
  - name: heartbeats
    title: Seconds between Heartbeats
    description: "Automatic battery report interval after the last event. Default: 4200 seconds (70 minutes)."
    required: true
    preferenceType: integer
    definition:
      minimum: 255
      maximum: 4200
      default: 4200
  - name: wakeUpInterval
    title: Wake Up Interval
    description: "Receive queued settings and request battery updates. Driver default: every 12 hours. Close the sensor cover to wake it sooner."
    required: true
    preferenceType: enumeration
    definition:
      options:
        3600: Every hour
        7200: Every 2 hours
        10800: Every 3 hours
        14400: Every 4 hours
        21600: Every 6 hours
        28800: Every 8 hours
        43200: Every 12 hours
        86400: Every 24 hours
      default: 43200
  - name: batteryInterval
    title: Battery Update Interval
    description: "Battery requests during wakeup. Automatic heartbeat battery reports remain enabled."
    required: true
    preferenceType: enumeration
    definition:
      options:
        0: Disabled
        1: Every wakeup
        2: Every other wakeup
        3: Every 3rd wakeup
        4: Every 4th wakeup
        101: Once per day maximum
      default: 1
